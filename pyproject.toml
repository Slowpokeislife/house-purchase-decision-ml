[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "house-purchase-decision-ml"
version = "1.0.0"
description = "Reproducible house purchase decision classification with neural networks and Optuna"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{name = "Portfolio project"}]
keywords = ["classification", "tensorflow", "optuna", "tabular-ml", "housing"]
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.1,<3", "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2", "matplotlib>=3.8,<4"
]

[project.optional-dependencies]
train = ["tensorflow>=2.16,<2.21", "optuna>=3.6,<5", "kagglehub>=0.3,<1"]
tracking = ["mlflow>=2.15,<4"]
app = ["streamlit>=1.35,<2", "tensorflow>=2.16,<2.21"]
dev = ["pytest>=8,<10"]

[project.scripts]
house-purchase = "house_purchase.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
